<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">TAKI</title>
  <desc id="description">Threat Analysis and Knowledge Intelligence</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#101d32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e7d2"/>
      <stop offset="1" stop-color="#91b9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38506a" stroke-width="1" opacity=".18"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 0h8v360H0z" fill="url(#accent)"/>
  <circle cx="970" cy="175" r="190" fill="#2d8ca4" opacity=".08" filter="url(#glow)"/>

  <rect x="72" y="54" width="177" height="30" rx="15" fill="#183a46" stroke="#2f756f"/>
  <circle cx="90" cy="69" r="4" fill="#57e7d2"/>
  <text x="104" y="74" fill="#9beedf" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SECURITY AGENT</text>

  <text x="65" y="197" fill="#f1f7ff" font-family="Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-7">TAKI</text>
  <rect x="72" y="215" width="76" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="258" fill="#b7cee4" font-family="Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="1.1">THREAT ANALYSIS &amp;</text>
  <text x="72" y="284" fill="#b7cee4" font-family="Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="1.1">KNOWLEDGE INTELLIGENCE</text>
  <text x="73" y="328" fill="#69c8c1" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">DESIGN  /  CODE  /  EVIDENCE</text>

  <path d="M652 180h53m0 0v-75h45m-45 75v75h45m229-150h32v75h31m-63 75h32v-75" fill="none" stroke="#5c8794" stroke-width="2" stroke-dasharray="4 6" opacity=".8"/>
  <circle cx="706" cy="180" r="7" fill="#57e7d2"/>
  <circle cx="1011" cy="180" r="7" fill="#91b9ff"/>

  <rect x="750" y="68" width="230" height="73" rx="14" fill="#152b3b" stroke="#3b6e74"/>
  <rect x="750" y="219" width="230" height="73" rx="14" fill="#152b3b" stroke="#3b6e74"/>
  <rect x="1042" y="143" width="100" height="74" rx="14" fill="#1c354a" stroke="#779fc4"/>

  <circle cx="781" cy="105" r="13" fill="#224e54"/>
  <path d="m775 105 4 4 8-9" fill="none" stroke="#72e9d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="808" y="101" fill="#e9f4fc" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">DESIGN</text>
  <text x="808" y="119" fill="#8cb5c5" font-family="Arial, sans-serif" font-size="11" letter-spacing=".5">THREATS &amp; CONTROLS</text>

  <circle cx="781" cy="256" r="13" fill="#224e54"/>
  <path d="m775 256 4 4 8-9" fill="none" stroke="#72e9d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="808" y="252" fill="#e9f4fc" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">CODE</text>
  <text x="808" y="270" fill="#8cb5c5" font-family="Arial, sans-serif" font-size="11" letter-spacing=".5">TRACE &amp; VERIFY</text>

  <path d="M1075 170h34m-34 10h34m-34 10h23" stroke="#a8c8ea" stroke-width="3" stroke-linecap="round"/>
  <text x="1092" y="238" fill="#a8c8ea" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">REPORT</text>

  <path d="M1190 24h-44m44 0v44M10 336h44m-44 0v-44" fill="none" stroke="#5daeb0" stroke-width="2" opacity=".55"/>
</svg>
