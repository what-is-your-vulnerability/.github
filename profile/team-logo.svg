<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">너의 취약점은</title>
  <desc id="description">A team wordmark with a red thread and star on a dark security-themed sky</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset=".68" stop-color="#142039"/>
      <stop offset="1" stop-color="#292a49"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb391"/>
      <stop offset=".55" stop-color="#f77287"/>
      <stop offset="1" stop-color="#d95d89"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e7d2"/>
      <stop offset="1" stop-color="#91b9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38506a" stroke-width="1" opacity=".13"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="88" fill="url(#night)"/>
